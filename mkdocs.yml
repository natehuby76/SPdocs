# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: StarPilot Docs
site_url: https://wiki.firestar.link/
site_description: Official StarPilot documentation for comma 3, 3X, and 4. Installation, supported cars, features, Galaxy, and troubleshooting.

# Reusable include fragments are not standalone documentation pages.
exclude_docs: |
  hardware/embed/

nav:
  - StarPilot:
      - Getting Started:
          - Welcome to StarPilot: index.md
          - Installing StarPilot: software/starpilot.md
      - Usage:
          - Operation: usage/operation.md
          - Settings: usage/settings.md
          - Galaxy & Features: usage/galaxy.md
          - Companion Apps:
              - Overview: usage/companion-apps/index.md
              - iOS: usage/companion-apps/ios.md
              - Android: usage/companion-apps/android.md
      - Tools:
          - Models: usage/model-manager.md
          - Navigation: exclusive/navigation.md
          - StarPort: exclusive/starport.md
          - Cameras & Monitoring: exclusive/cameras-and-monitoring.md
          - Sentry Mode: exclusive/sentry-mode.md
          - Bluetooth: exclusive/bluetooth-controls.md
      - Toggles:
          - Lane Centering: exclusive/lane-centering.md
          - Speed Limit Controller: exclusive/speed-limit-controller.md
      - Troubleshooting & FAQ:
          - Ticket System: ticketsystem.md
          - FAQ: faq.md
  - Vehicle Specific Information:
      - Vehicle Compatibility: cars/support.md
      - Car Setup Guides: cars/all.md
      - GM:
          - Bolt EV: cars/bolt.md
          - Volt & Other ASCM/SDGM Cars: cars/volt.md
      - Hyundai / Kia:
          - Long Setup for Some HDA2 Vehicles: cars/hkg-hda2-longitudinal.md
  - Comma Hardware Info:
      - Comma Devices: hardware/comma.md
      - Comma Installation:
          - Installing comma hardware in a Bolt: install/comma.md
          - Mounting your Comma: install/mounting.md
      - Chestnut (External GPU): hardware/chestnut.md
      - Comma Pedal:
          - Pedal Information: hardware/comma-pedal.md
          - Pedal Installation: install/pedal.md
      - GM Harness: hardware/gm-harness.md
      - OBD-C Cable: hardware/obd-c.md
      - OBD Harness: hardware/obd-harness.md
    
theme:
  name: material
  custom_dir: overrides

  logo: assets/images/galaxy-icon.svg
  favicon: assets/images/favicon.ico

  icon:
    repo: fontawesome/brands/github

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.footer

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list

plugins:
  - search
  - redirects:
      redirect_maps:
        features.md: usage/galaxy.md
        usage/driving-model.md: usage/model-manager.md
        exclusive/android-auto.md: exclusive/starport.md
  - social:
      # Start fresh so cached social cards cannot retain the previous logo.
      cache_dir: .cache/plugin/social-starpilot
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - git-committers:
      repository: StarPilot-Docs/docs
      branch: main
  - callouts
  - include-markdown

repo_url: https://github.com/StarPilotHQ/StarPilot
repo_name: StarPilotHQ/StarPilot

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://firestar.link/discord
